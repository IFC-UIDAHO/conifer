# CONIFER — Stand Structure Studio · native theme (applied on a clean restart).
# The app also forces this palette via CSS so it renders correctly on hot-reload.
[theme]
base = "light"
primaryColor = "#2D6A4F"
backgroundColor = "#F4F2EA"
secondaryBackgroundColor = "#FBFAF6"
textColor = "#15281C"

[client]
toolbarMode = "minimal"
