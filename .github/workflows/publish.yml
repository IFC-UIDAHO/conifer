name: Publish to PyPI

# Publishes when a version tag (e.g. v0.1.0) is pushed.
# Uses PyPI Trusted Publishing (OIDC) - no API token/secret is stored in the repo.
# One-time setup on PyPI: Project -> Publishing -> add a GitHub trusted publisher with
#   owner: IFC-UIDAHO   repo: conifer   workflow: publish.yml   environment: pypi
#
# Two guards, added after v0.2.4 was tagged on a commit that still said 0.2.3 and the
# release failed at the very last step with an opaque `400 File already exists`:
#
#   1. The tag is checked against BOTH version strings before anything is built. The
#      version lives in pyproject.toml and conifer/__init__.py and they have drifted
#      before, so both are checked. A mismatch now fails in seconds with a readable
#      message instead of after a full build, upload and Docker pull.
#   2. `skip-existing` stops a re-run of an already-published version from going red.
#      PyPI files are immutable, so re-running a shipped release is a no-op, not an
#      error. Guard 1 is what keeps this from hiding a genuinely unbumped version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib

          tag = os.environ["TAG"].lstrip("v")
          proj = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__\s*=\s*"([^"]+)"',
                           open("conifer/__init__.py", encoding="utf-8").read()).group(1)

          print(f"tag={tag}  pyproject.toml={proj}  conifer/__init__.py={init}")

          wrong = [f"{n} says {v}" for n, v in
                   (("pyproject.toml", proj), ("conifer/__init__.py", init)) if v != tag]
          if wrong:
              print(f"::error::Tag v{tag} does not match the source: {'; '.join(wrong)}. "
                    "Bump the version in both files, commit, then move the tag.")
              sys.exit(1)
          PY

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a release that already shipped is a no-op, not a failure.
          skip-existing: true
