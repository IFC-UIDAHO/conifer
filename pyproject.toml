[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conifer-sae"
version = "0.2.0"
description = "Compositional, design-aware small-area estimation of forest diameter distributions with conformal prediction sets."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jaslam Poolakkal", email = "mjaslam@uidaho.edu" }]
keywords = ["small area estimation", "Fay-Herriot", "forestry", "diameter distribution", "compositional data", "conformal prediction", "FIA", "LiDAR", "NAIP", "forest inventory", "timber cruise"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "scikit-learn>=1.1", "pandas>=1.4", "matplotlib>=3.5"]

[project.optional-dependencies]
bart = ["xgboost>=1.6"]
test = ["pytest>=7.0"]
geo = ["geopandas>=0.13", "shapely>=2.0", "pyproj>=3.4"]
report = ["openpyxl>=3.1"]
app = ["conifer-sae[geo,report]", "streamlit>=1.36", "folium>=0.14", "streamlit-folium>=0.20"]

[project.scripts]
conifer = "conifer.cli:main"

[project.urls]
Homepage = "https://github.com/IFC-UIDAHO/conifer"
Documentation = "https://github.com/IFC-UIDAHO/conifer#readme"
Issues = "https://github.com/IFC-UIDAHO/conifer/issues"
Repository = "https://github.com/IFC-UIDAHO/conifer"

[tool.hatch.build.targets.wheel]
packages = ["conifer"]
